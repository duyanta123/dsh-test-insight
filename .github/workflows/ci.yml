name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.11.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Validate package contents
        run: npm run pack:check

  package-smoke:
    name: Packed package smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install locked dependencies
        run: npm ci
      - name: Pack
        shell: bash
        run: |
          mkdir -p .ci/package-smoke
          npm pack --pack-destination .ci/package-smoke
      - name: Install packed package in a clean project
        shell: bash
        run: |
          mkdir -p .ci/package-smoke/consumer
          cd .ci/package-smoke/consumer
          npm init -y
          npm install ../dsh-test-insight-*.tgz
      - name: Load public exports and scanner dependency
        shell: bash
        run: |
          node --input-type=module -e "const plugin = await import('dsh-test-insight'); const core = await import('dsh-test-insight/core'); const scanner = await import('dsh-repo-scanner/scanner'); if (plugin.name !== 'dsh-test-insight' || typeof core.analyze !== 'function' || typeof scanner.scanRepository !== 'function') process.exit(1); console.log('package smoke passed');"

  compat:
    name: DSH compat / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pnpm for DSH plugin manager
        run: npm install --global pnpm@10.28.1
      - name: DSH 0.1.5-rc.2 compatibility
        run: npm run test:compat
