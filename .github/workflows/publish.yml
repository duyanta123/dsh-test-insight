name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm trusted publishing support
        run: npm install --global npm@11.5.1

      - name: Run package checks
        run: |
          node --version
          npm --version
          npm run check --if-present
          npm test
          npm pack --dry-run

      - name: Publish to npm with OIDC
        # Bootstrap: npm OIDC cannot first-publish a new package (npm/cli#8544),
        # so 1.0.0-rc.3 is published manually (see PUBLISHING.md §npm). Skip the
        # tag-triggered run once that version is already on the registry.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the npm registry; skipping publish."
          else
            npm publish --access public
          fi
